<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Order v8 - Full History Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { position: sticky; top: 0; z-index: 10; background: #f3f4f6; font-size: 0.75rem; font-weight: 700; color: #374151; padding: 8px 4px; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        td { padding: 4px 2px; vertical-align: middle; border-bottom: 1px solid #e5e7eb; }
        .col-no { width: 25px; text-align: center; }
        .col-name { min-width: 140px; max-width: 220px; } 
        .col-type { width: 75px; }
        .col-qty { width: 50px; }
        .col-weight, .col-cbm { width: 60px; text-align: center; background-color: #f9fafb; font-size: 0.7rem; color: #6b7280; }
        .col-price { width: 100px; }
        .col-bonus { width: 80px; }
        .col-total { width: 110px; text-align: right; }
        .form-input-sm, .form-select-sm { @apply w-full px-1 py-1 text-xs border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white; min-height: 30px; }
        @media (max-width: 640px) { .col-name { min-width: 120px; max-width: 160px; } th, td { font-size: 0.7rem; } .container { padding: 0.5rem; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-2 md:p-4 max-w-full md:max-w-[98%]">
        <header class="mb-4 bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-900">Formulir Data Order</h1>
                <p class="text-xs text-green-600 font-bold flex items-center gap-1">Support Excel XLS/XLSX</p>
            </div>
            <button onclick="toggleModal('priceListModal', true)" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold shadow flex justify-center items-center gap-2">
                Update Database
            </button>
        </header>

        <section class="mb-3 bg-white p-4 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">I. Data Pelanggan</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="customerName" class="w-full px-3 py-2 text-sm border border-gray-300 rounded outline-none" placeholder="Nama Pelanggan / PT">
                <input type="text" id="keterangan" class="w-full px-3 py-2 text-sm border border-gray-300 rounded outline-none" placeholder="Alamat / Keterangan Lain">
            </div>
        </section>

        <section class="mb-6 bg-white p-2 md:p-4 rounded-lg shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-xs md:text-sm font-bold text-gray-500 uppercase tracking-wide">II. Detail Pesanan</h2>
                <div class="flex gap-2 items-center">
                    <span class="text-xs text-gray-400">Database: <span id="dbCount" class="font-bold text-blue-600">0</span></span>
                    <button onclick="addNewRow()" class="bg-gray-100 px-3 py-1 rounded text-xs font-bold border">+ Baris</button>
                </div>
            </div>

            <div class="overflow-x-auto border rounded-lg max-h-[60vh] relative">
                <table class="min-w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="col-no">#</th>
                            <th class="col-name text-left pl-2">Nama Barang</th>
                            <th class="col-type">Tipe</th>
                            <th class="col-qty">Qty</th>
                            <th class="col-weight border-l">Kg</th>
                            <th class="col-cbm border-l">M³</th>
                            <th class="col-price">Harga</th>
                            <th class="col-bonus">Bonus</th>
                            <th class="col-total pr-2">Total</th>
                            <th class="w-8"></th>
                        </tr>
                    </thead>
                    <tbody id="order-rows-body" class="text-sm bg-white divide-y"></tbody>
                    <tfoot class="text-sm bg-gray-50 font-bold sticky bottom-0 z-20">
                        <tr>
                            <td colspan="4" class="text-right pr-2 text-xs text-gray-400">LOGISTIK:</td>
                            <td class="text-center bg-gray-100" id="total-weight">0</td>
                            <td class="text-center bg-gray-100" id="total-cbm">0</td>
                            <td colspan="4"></td>
                        </tr>
                        <tr class="bg-blue-50 text-blue-900">
                            <td colspan="8" class="text-right py-3 pr-3">TOTAL:</td>
                            <td id="grand-total" class="text-right py-3 pr-2 text-lg font-extrabold">Rp 0</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section class="flex flex-col md:flex-row justify-end gap-3 mb-10">
            <button onclick="resetAll()" class="bg-white border py-3 px-6 rounded-full shadow text-sm font-bold">Reset Form</button>
            <button onclick="submitOrder()" class="bg-green-600 text-white py-3 px-8 rounded-full shadow text-sm font-bold flex justify-center items-center gap-2">
                Simpan & WA
            </button>
        </section>

        <section id="orderLogSection" class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 hidden">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">Riwayat Pesanan</h2>
            <div id="orderLogContent" class="space-y-2 max-h-[400px] overflow-y-auto"></div>
        </section>
    </div>

    <div id="priceListModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden">
            <div class="bg-gray-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold">Update Database</h3>
                <button onclick="toggleModal('priceListModal', false)" class="text-2xl">&times;</button>
            </div>
            <div class="p-6">
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center relative">
                    <input type="file" id="fileInput" accept=".xls, .xlsx" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileUpload(this)">
                    <p class="text-sm text-gray-600">Klik atau Tarik File Excel ke sini</p>
                </div>
                <div id="uploadResult" class="mt-4 hidden">
                    <p id="uploadStatusMsg" class="text-center font-bold text-sm mb-2"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="waModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh]">
            <div class="p-4 border-b flex justify-between">
                <h3 class="font-bold">Preview WhatsApp</h3>
                <button onclick="toggleModal('waModal', false)" class="text-2xl">&times;</button>
            </div>
            <div class="p-4 flex-1 overflow-hidden flex flex-col">
                <textarea id="waText" class="w-full flex-1 border rounded p-3 text-xs font-mono mb-4 resize-none" readonly></textarea>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyWA()" class="bg-gray-200 py-3 rounded-lg font-bold">Salin Teks</button>
                    <button onclick="openWA()" class="bg-green-600 text-white py-3 rounded-lg font-bold">Buka WA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEYS = { PRICES: 'ehose_prices_v8', LOG: 'ehose_log_v8', CUST: 'ehose_cust_v8' };
        let priceList = [];
        let orderLog = [];
        const INITIAL_ROWS = 10;

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            initTable();
            renderLog();
        });

        function loadData() {
            const savedPrices = localStorage.getItem(KEYS.PRICES);
            priceList = savedPrices ? JSON.parse(savedPrices) : [];
            document.getElementById('dbCount').textContent = priceList.length;
            const savedLog = localStorage.getItem(KEYS.LOG);
            orderLog = savedLog ? JSON.parse(savedLog) : [];
        }

        function initTable() {
            const tbody = document.getElementById('order-rows-body');
            tbody.innerHTML = '';
            for(let i=0; i<INITIAL_ROWS; i++) addRowHTML(i);
            updateDropdowns();
        }

        function addRowHTML(i) {
            const tbody = document.getElementById('order-rows-body');
            const tr = document.createElement('tr');
            tr.id = `row-${i}`;
            tr.innerHTML = `
                <td class="col-no idx text-[10px] text-gray-400">${i+1}</td>
                <td class="col-name"><select class="item-select form-select-sm" onchange="updateRow(${i})"><option value="">-- Pilih --</option></select></td>
                <td class="col-type"><select class="type-select form-select-sm" onchange="updateRow(${i})"><option value="isp">ISP</option><option value="msrp">MSRP</option><option value="special">Special</option></select></td>
                <td class="col-qty"><input type="number" class="qty-input form-input-sm text-center" oninput="updateRow(${i})"></td>
                <td class="col-weight border-l"><span class="val-weight">-</span></td>
                <td class="col-cbm border-l"><span class="val-cbm">-</span></td>
                <td class="col-price"><input type="text" class="price-input form-input-sm text-right" disabled onkeyup="formatInput(this); updateRow(${i})"></td>
                <td class="col-bonus"><input type="text" class="bonus-input form-input-sm"></td>
                <td class="col-total"><span class="val-total font-bold">0</span></td>
                <td class="text-center"><button onclick="removeRow(this)" class="text-red-400 font-bold">&times;</button></td>
            `;
            tbody.appendChild(tr);
        }

        function addNewRow() {
            const tbody = document.getElementById('order-rows-body');
            const newIdx = tbody.children.length;
            addRowHTML(newIdx);
            populateSelect(tbody.lastChild.querySelector('.item-select'));
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            calcGrandTotal();
            document.querySelectorAll('#order-rows-body tr').forEach((tr, idx) => tr.querySelector('.idx').textContent = idx + 1);
        }

        function updateDropdowns() {
            priceList.sort((a,b) => a.name.localeCompare(b.name));
            document.querySelectorAll('.item-select').forEach(sel => populateSelect(sel));
        }

        function populateSelect(select) {
            const current = select.value;
            let html = `<option value="">-- Pilih --</option>`;
            html += priceList.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            select.innerHTML = html;
            select.value = current;
        }

        function updateRow(idx) {
            const row = document.getElementById(`row-${idx}`);
            if(!row) return;
            const itemId = row.querySelector('.item-select').value;
            const type = row.querySelector('.type-select').value;
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const priceInput = row.querySelector('.price-input');
            
            let price = 0, w = 0, cbm = 0;
            if(itemId) {
                const item = priceList.find(p => p.id == itemId);
                if(item) {
                    w = item.w || 0; cbm = item.cbm || 0;
                    if(type === 'special') {
                        priceInput.disabled = false;
                        price = parseNumber(priceInput.value);
                    } else {
                        priceInput.disabled = true;
                        price = (type === 'msrp') ? item.msrp : item.isp;
                        priceInput.value = formatRupiah(price);
                    }
                }
            }
            row.querySelector('.val-total').textContent = formatRupiah(price * qty);
            row.querySelector('.val-weight').textContent = (w * qty) > 0 ? (w * qty).toFixed(2) : '-';
            row.querySelector('.val-cbm').textContent = (cbm * qty) > 0 ? (cbm * qty).toFixed(4) : '-';
            calcGrandTotal();
        }

        function calcGrandTotal() {
            let gt = 0, tw = 0, tc = 0;
            document.querySelectorAll('#order-rows-body tr').forEach(row => {
                gt += parseNumber(row.querySelector('.val-total').textContent);
                tw += parseFloat(row.querySelector('.val-weight').textContent) || 0;
                tc += parseFloat(row.querySelector('.val-cbm').textContent) || 0;
            });
            document.getElementById('grand-total').textContent = formatRupiah(gt);
            document.getElementById('total-weight').textContent = tw.toFixed(2) + " kg";
            document.getElementById('total-cbm').textContent = tc.toFixed(4) + " m³";
        }

        // FUNGSI LOG HISTORY (HAPUS & BUKA)
        function renderLog() {
            const div = document.getElementById('orderLogContent');
            const section = document.getElementById('orderLogSection');
            if(orderLog.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            div.innerHTML = orderLog.map(l => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded border text-xs shadow-sm">
                    <div class="flex-1 cursor-pointer" onclick="reopenOrder(${l.id})">
                        <div class="font-bold text-gray-800">${l.name || 'Tanpa Nama'}</div>
                        <div class="text-gray-400">${l.date} • ${l.itemsCount} Item</div>
                        <div class="text-blue-600 font-bold">${l.total}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="reopenOrder(${l.id})" class="bg-blue-100 text-blue-600 px-3 py-1 rounded font-bold">Buka</button>
                        <button onclick="deleteLog(${l.id})" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteLog(id) {
            if(confirm("Hapus riwayat ini?")) {
                orderLog = orderLog.filter(l => l.id !== id);
                localStorage.setItem(KEYS.LOG, JSON.stringify(orderLog));
                renderLog();
            }
        }

        function reopenOrder(id) {
            const data = orderLog.find(l => l.id === id);
            if(!data || !data.fullItems) return;
            if(!confirm("Buka kembali pesanan ini? Inputan saat ini akan di-reset.")) return;

            document.getElementById('customerName').value = data.name || '';
            document.getElementById('keterangan').value = data.keterangan || '';
            
            const tbody = document.getElementById('order-rows-body');
            tbody.innerHTML = '';
            
            data.fullItems.forEach((item, i) => {
                addRowHTML(i);
                const row = document.getElementById(`row-${i}`);
                const match = priceList.find(p => p.name === item.name);
                if(match) {
                    const sel = row.querySelector('.item-select');
                    populateSelect(sel);
                    sel.value = match.id;
                }
                row.querySelector('.type-select').value = item.type.toLowerCase();
                row.querySelector('.qty-input').value = item.qty;
                row.querySelector('.bonus-input').value = item.bonus || '';
                if(item.type.toLowerCase() === 'special') {
                    row.querySelector('.price-input').disabled = false;
                    row.querySelector('.price-input').value = item.price;
                }
                updateRow(i);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitOrder() {
            let items = [];
            document.querySelectorAll('#order-rows-body tr').forEach(row => {
                const qty = parseFloat(row.querySelector('.qty-input').value);
                if(qty > 0) {
                    const sel = row.querySelector('.item-select');
                    items.push({
                        name: sel.options[sel.selectedIndex].text,
                        qty: qty,
                        price: row.querySelector('.price-input').value,
                        total: row.querySelector('.val-total').textContent,
                        type: row.querySelector('.type-select').value.toUpperCase(),
                        bonus: row.querySelector('.bonus-input').value
                    });
                }
            });
            if(items.length === 0) return alert("Isi pesanan!");

            const cName = document.getElementById('customerName').value;
            const cKet = document.getElementById('keterangan').value;
            const gTotal = document.getElementById('grand-total').textContent;
            const date = new Date().toLocaleString('id-ID');

            orderLog.unshift({ id: Date.now(), date, name: cName, keterangan: cKet, total: gTotal, itemsCount: items.length, fullItems: items });
            localStorage.setItem(KEYS.LOG, JSON.stringify(orderLog));
            renderLog();

            let txt = `*ORDER BARU*\n📅 ${date}\n👤 ${cName}\n\n*DETAIL:*\n`;
            items.forEach(i => txt += `- ${i.name} (${i.qty}x)\n  Harga: ${i.price} [${i.type}]\n`);
            txt += `\n*TOTAL: ${gTotal}*`;
            document.getElementById('waText').value = txt;
            toggleModal('waModal', true);
        }

        // HELPERS
        function formatRupiah(n) { return new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', minimumFractionDigits:0}).format(n); }
        function parseNumber(str) { return parseInt(str.replace(/\D/g, ''), 10) || 0; }
        function formatInput(el) { el.value = formatRupiah(parseNumber(el.value)); }
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
        function copyWA() { document.getElementById('waText').select(); document.execCommand('copy'); alert("Disalin!"); }
        function openWA() { window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('waText').value)}`, '_blank'); }
        function resetAll() { if(confirm("Reset?")) { document.getElementById('customerName').value=''; document.getElementById('keterangan').value=''; initTable(); calcGrandTotal(); } }

        // EXCEL UPLOAD
        function handleFileUpload(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
                
                let newItems = [];
                // Simple Mapping: Kolom 0=Nama, 1=ISP, 2=MSRP, 4=Berat, 6=CBM
                rows.forEach((row, i) => {
                    if(i > 0 && row[0]) {
                        newItems.push({
                            id: 'item_'+Date.now()+'_'+i,
                            name: row[0],
                            isp: parseInt(row[1]) || 0,
                            msrp: parseInt(row[2]) || 0,
                            w: parseFloat(row[4]) || 0,
                            cbm: parseFloat(row[6]) || 0
                        });
                    }
                });
                priceList = newItems;
                localStorage.setItem(KEYS.PRICES, JSON.stringify(priceList));
                document.getElementById('dbCount').textContent = priceList.length;
                updateDropdowns();
                alert("Database Berhasil Diupdate!");
                toggleModal('priceListModal', false);
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
